name: Set Private
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  privatize:
    runs-on: ubuntu-latest
    steps:
      - name: PATCH repository visibility to private
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          echo "GITHUB_TOKEN permissions in this workflow: contents: write"
          echo "Note: workflow key permissions.administration was rejected by Actions parser (Unexpected value)."
          BODY=$(curl -sS -w "\nHTTP_STATUS:%{http_code}\n" -X PATCH \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}" \
            -d '{"private":true}')
          printf '%s\n' "$BODY"
          echo "$BODY" | grep -q 'HTTP_STATUS:200'
          exit $?
