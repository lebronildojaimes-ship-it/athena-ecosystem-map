name: Set Private
on:
  workflow_dispatch:
permissions:
  contents: write
  administration: write
jobs:
  privatize:
    runs-on: ubuntu-latest
    steps:
      - name: PATCH repository visibility to private
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          echo "token permissions attempt: contents write + administration write"
          BODY=$(curl -sS -w "\nHTTP_STATUS:%{http_code}\n" -X PATCH \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}" \
            -d '{"private":true}')
          # Do not print the token. Print status and API body only.
          printf '%s\n' "$BODY"
          echo "$BODY" | grep -q 'HTTP_STATUS:200'
          exit $?
